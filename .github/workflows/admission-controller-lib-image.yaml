name: admission-controller-lib image

on:
  pull_request:
    paths:
      - charts/admission-controller-lib/**
      - .github/workflows/admission-controller-lib-image.yaml
  push:
    branches: [master]
    paths:
      - charts/admission-controller-lib/**
      - .github/workflows/admission-controller-lib-image.yaml

permissions:
  contents: read
  packages: write

env:
  CHART_DIR: charts/admission-controller-lib
  IMAGE: ghcr.io/neuro-inc/admission-controller-lib

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the image tag
        id: tag
        run: |
          app_version=$(awk '/^appVersion:/ {print $2}' "$CHART_DIR/Chart.yaml" | tr -d '"')
          template_tag=$(grep -o "$IMAGE:[^ \"]*" "$CHART_DIR/templates/_helpers.tpl" | cut -d: -f2)
          if [ "$app_version" != "$template_tag" ]; then
            echo "::error::Chart.yaml appVersion ($app_version) and the image tag in _helpers.tpl ($template_tag) must match"
            exit 1
          fi
          echo "tag=$app_version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: docker build -t "$IMAGE:${{ steps.tag.outputs.tag }}" "$CHART_DIR/src"

      - name: Smoke test
        run: |
          docker run --rm --entrypoint python "$IMAGE:${{ steps.tag.outputs.tag }}" \
            -c "import hooks.pre_install, hooks.post_install"

      - name: Login to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name == 'push'
        run: |
          ref="$IMAGE:${{ steps.tag.outputs.tag }}"
          if docker manifest inspect "$ref" > /dev/null 2>&1; then
            echo "::warning::$ref already exists; bump appVersion and the tag in _helpers.tpl to publish a new image"
            exit 0
          fi
          docker push "$ref"
