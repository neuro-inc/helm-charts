apiVersion: v1
kind: Service
metadata:
  name: {{ include "bucket-usage.fullname" . }}
  labels:
    {{- include "bucket-usage.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
  selector:
    {{- include "bucket-usage.selectorLabels" . | nindent 4 }}
