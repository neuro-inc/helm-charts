{{- if .Values.bucketUsage.enabled }}
{{- if ne .Values.storage "s3" }}
{{- fail "bucketUsage needs storage: s3" }}
{{- end }}
{{- if not (or .Values.secrets.s3.existingSecret (and .Values.secrets.s3.accessKey .Values.secrets.s3.secretKey)) }}
{{- fail "bucketUsage needs static S3 credentials: secrets.s3.existingSecret or secrets.s3.accessKey and secretKey" }}
{{- end }}
{{- $fullname := printf "%s-bucket-usage" (include "docker-registry.fullname" . | trunc 50 | trimSuffix "-") }}
{{- $app := printf "%s-bucket-usage" (include "docker-registry.name" . | trunc 50 | trimSuffix "-") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}
  labels:
    app: {{ $app }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    heritage: {{ .Release.Service }}
    release: {{ .Release.Name }}
data:
  bucket_usage.py: |-
{{ .Files.Get "files/bucket_usage.py" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    app: {{ $app }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $app }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ $app }}
        release: {{ .Release.Name }}
      annotations:
        checksum/script: {{ .Files.Get "files/bucket_usage.py" | sha256sum }}
    spec:
{{- if .Values.priorityClassName }}
      priorityClassName: "{{ .Values.priorityClassName }}"
{{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: bucket-usage
          image: "{{ .Values.bucketUsage.image.repository }}:{{ .Values.bucketUsage.image.tag }}"
          imagePullPolicy: {{ .Values.bucketUsage.image.pullPolicy }}
          command: ["python", "/app/bucket_usage.py"]
          ports:
            - name: metrics
              containerPort: 9100
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: S3_ENDPOINT
              value: {{ required ".Values.bucketUsage.endpoint is required" .Values.bucketUsage.endpoint | quote }}
            - name: S3_REGION
              value: {{ required ".Values.s3.region is required" .Values.s3.region | quote }}
            - name: S3_BUCKET
              value: {{ required ".Values.s3.bucket is required" .Values.s3.bucket | quote }}
            - name: SCAN_INTERVAL_SECONDS
              value: {{ .Values.bucketUsage.scanIntervalSeconds | quote }}
            {{- if .Values.secrets.s3.existingSecret }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.s3.existingSecret.name }}
                  key: {{ .Values.secrets.s3.existingSecret.s3AccessKeySecretKey | default "s3AccessKey" }}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.s3.existingSecret.name }}
                  key: {{ .Values.secrets.s3.existingSecret.s3SecretKeySecretKey | default "s3SecretKey" }}
            {{- else }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ template "docker-registry.fullname" . }}-secret
                  key: s3AccessKey
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ template "docker-registry.fullname" . }}-secret
                  key: s3SecretKey
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
{{ toYaml .Values.bucketUsage.resources | indent 12 }}
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
{{- if .Values.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
{{- end }}
{{- if .Values.tolerations }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
{{- end }}
      volumes:
        - name: script
          configMap:
            name: {{ $fullname }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  labels:
    app: {{ $app }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
  selector:
    app: {{ $app }}
    release: {{ .Release.Name }}
{{- if .Values.bucketUsage.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $fullname }}
  labels:
    app: {{ $app }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    {{- with .Values.bucketUsage.serviceMonitor.labels }}
{{ toYaml . | indent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app: {{ $app }}
      release: {{ .Release.Name }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.bucketUsage.serviceMonitor.interval }}
{{- end }}
{{- end }}
